<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>פאנל ניהול | שרה 🍰</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Assistant',sans-serif;background:#0d0603;color:#f2d9c0;direction:rtl;min-height:100vh}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#2a1005,#0d0603 65%)}
.lc{background:#1c0f07;border:1.5px solid #c8704a;border-radius:24px;padding:44px 36px 36px;width:100%;max-width:380px;box-shadow:0 40px 100px rgba(0,0,0,.7);text-align:center}
.lc-logo{font-size:52px;margin-bottom:10px}.lc-title{font-size:26px;font-weight:800;margin-bottom:4px}.lc-sub{font-size:14px;color:#9a7060;margin-bottom:28px}
.lc input{width:100%;background:#2a1507;border:1.5px solid #5a3020;border-radius:12px;padding:13px 15px;font-size:15px;font-family:inherit;color:#f2d9c0;outline:none;margin-bottom:13px;direction:ltr;text-align:left;transition:border-color .2s}
.lc input:focus{border-color:#c8704a}.lc input::placeholder{direction:rtl;text-align:right;color:#7a5040}
.lc-btn{width:100%;background:linear-gradient(135deg,#c8704a,#e8905a);border:none;border-radius:13px;padding:15px;font-size:16px;font-weight:800;color:#fff;font-family:inherit;cursor:pointer;transition:opacity .2s}
.lc-btn:hover{opacity:.9}.lc-btn:disabled{opacity:.45;cursor:not-allowed}
.lc-msg{font-size:13px;font-weight:700;min-height:20px;margin-top:12px;color:#e07050}
.lc-back{margin-top:18px;font-size:12px;color:#7a5040}.lc-back a{color:#c8704a}
#dash{display:none;flex-direction:column;min-height:100vh}
#dash.on{display:flex}
.hdr{background:#150a04;border-bottom:1px solid #2a1507;height:56px;padding:0 16px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:10px}
.hdr-logo{font-size:17px;font-weight:800;flex:1;white-space:nowrap}.hdr-logo span{color:#c8704a}
.hdr-clock{font-size:13px;font-weight:700;color:#9a7060;white-space:nowrap}
.hdr-btn{border:none;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.hdr-back{background:#2a1507;color:#c8704a;border:1px solid #5a3020}.hdr-out{background:#3a1010;color:#e07050;border:1px solid #6a2020}
.hdr-btn:hover{opacity:.75}
.tabs-bar{background:#110805;border-bottom:1px solid #2a1507;display:flex;padding:0 12px;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tb{background:none;border:none;color:#9a7060;font-size:13px;font-weight:700;font-family:inherit;padding:12px 13px;cursor:pointer;border-bottom:3px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap}
.tb.on{color:#c8704a;border-bottom-color:#c8704a}.tb:hover:not(.on){color:#f2d9c0}
.nb{display:inline-flex;align-items:center;justify-content:center;background:#c8704a;color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:17px;height:17px;padding:0 4px;margin-right:4px}
.pane{flex:1;padding:16px;max-width:960px;width:100%;margin:0 auto}
/* DATE NAV */
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.date-arrow{background:#1c0f07;border:1px solid #3a1e0c;color:#c8704a;border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s;flex-shrink:0}
.date-arrow:hover{background:#3a1e0c;border-color:#c8704a}
.date-center{flex:1;text-align:center;background:#1c0f07;border:1px solid #3a1e0c;border-radius:12px;padding:9px 14px;cursor:pointer;min-width:130px}
.date-center:hover{border-color:#c8704a}
.date-main{font-size:16px;font-weight:800}.date-sub{font-size:11px;color:#9a7060;margin-top:2px}
.date-btn{background:#2a1507;border:1px solid #c8704a;color:#c8704a;border-radius:10px;padding:8px 13px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;flex-shrink:0;white-space:nowrap;transition:all .2s}
.date-btn.active{background:#c8704a;color:#fff}.date-btn:hover:not(.active){background:#3a1e0c}
input[type="date"]#datePicker{background:#2a1507;border:1.5px solid #5a3020;color:#f2d9c0;border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;display:none}
input[type="date"]#datePicker.on{display:block}
/* KPIS */
.day-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ds{background:#1c0f07;border:1px solid #3a1e0c;border-radius:12px;padding:10px 14px;flex:1;min-width:80px;text-align:center}
.ds-v{font-size:22px;font-weight:800;color:#c8704a}.ds-l{font-size:10px;color:#9a7060;margin-top:2px;font-weight:700}
/* STATUS FILTERS */
.sf-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sf{background:#1c0f07;border:1px solid #3a1e0c;color:#9a7060;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;white-space:nowrap}
.sf.on{background:#c8704a;border-color:#c8704a;color:#fff}.sf:hover:not(.on){border-color:#c8704a;color:#c8704a}
/* ORDER CARD */
.oc{background:#1a0c05;border:1.5px solid #2e1a0a;border-radius:18px;margin-bottom:16px;overflow:hidden;transition:border-color .2s}
.oc:hover{border-color:#5a3020}.oc.urgent{border-color:#c8704a}
.oc-hdr{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.oc-avatar{width:46px;height:46px;border-radius:50%;background:#2a1507;border:2px solid #5a3020;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;cursor:pointer;transition:border-color .2s;font-weight:800;color:#f2d9c0}
.oc-avatar:hover{border-color:#c8704a}
.oc-id{flex:1;min-width:0}
.oc-name{font-size:17px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.oc-name:hover{color:#c8704a}
.oc-name-hint{font-size:11px;color:#7a5040;font-weight:600}
.oc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.oc-contact{font-size:13px;color:#9a7060}
.oc-num{font-size:11px;color:#6a4030;background:#2a1507;border-radius:6px;padding:2px 7px}
.oc-timing{background:#3a1e0c;border:1px solid #c8704a;border-radius:10px;padding:6px 12px;text-align:center;flex-shrink:0}
.oc-timing-time{font-size:18px;font-weight:800;color:#c8704a}
.oc-timing-date{font-size:11px;color:#9a7060;margin-top:1px}
.oc-timing-mode{font-size:11px;color:#f0c080;margin-top:1px;font-weight:700}
/* STEPPER */
.stepper-wrap{padding:12px 16px;border-top:1px solid #2a1507}
.stepper{display:flex;align-items:center;margin-bottom:10px}
.ss{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;cursor:default;user-select:none}
.sd{width:36px;height:36px;border-radius:50%;border:2px solid #3a1e0c;background:#1c0f07;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.ss.done .sd{background:#0a3a15;border-color:#1a8a30;font-size:13px;color:#5af080}
.ss.current .sd{background:#3a1e0c;border-color:#c8704a;box-shadow:0 0 10px rgba(200,112,74,.4)}
.ss.next .sd{border-color:#c8704a;background:#2a1507}
.ss.future .sd{opacity:.35}
.slb{font-size:10px;font-weight:700;text-align:center;margin-top:2px;white-space:nowrap}
.ss.done .slb{color:#3a9a50}.ss.current .slb{color:#c8704a}.ss.next .slb{color:#e8905a}.ss.future .slb{color:#5a3020}
.sl{flex:1;height:2px;background:#2a1507;min-width:6px;margin-bottom:18px}
.sl.done{background:#1a7a28}
.adv-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:linear-gradient(135deg,#c8704a,#e8905a);border:none;border-radius:11px;padding:11px;font-size:14px;font-weight:800;color:#fff;font-family:inherit;cursor:pointer;transition:opacity .2s}
.adv-btn:hover{opacity:.85}
.status-cancelled{text-align:center;padding:12px;font-size:15px;font-weight:700;color:#e07050;background:#2a1010;border-radius:10px}
.status-done{text-align:center;padding:12px;font-size:15px;font-weight:700;color:#3a9a50}
.action-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.act-sm{flex:1;border:none;border-radius:9px;padding:8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity .2s;min-width:80px}
.act-sm:hover{opacity:.8}
.act-cancel{background:#2a1810;color:#e07050;border:1px solid #6a2020}
.act-delete{background:#3a0808;color:#ff6060;border:1px solid #8a1010}
/* ITEMS */
.oc-items{border-top:1px solid #2a1507}
.items-toggle{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:700;color:#9a7060;display:flex;align-items:center;gap:8px;transition:color .2s}
.items-toggle:hover{color:#f2d9c0}
.items-list{display:none;padding:0 16px 14px}.items-list.on{display:block}
.item-row{padding:8px 0;border-bottom:1px solid #1a0c05;display:flex;gap:8px;align-items:flex-start}
.item-row:last-child{border-bottom:none}
.item-qty{font-size:13px;font-weight:800;color:#c8704a;background:#2a1507;border-radius:8px;padding:2px 8px;flex-shrink:0}
.item-name{font-size:14px;font-weight:700;flex:1}
.item-details{font-size:12px;color:#9a7060;margin-top:2px}
.item-price{font-size:13px;font-weight:800;color:#c8704a;flex-shrink:0}
/* PAYMENT */
.oc-pay{padding:12px 16px;border-top:1px solid #2a1507;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pay-label{font-size:13px;font-weight:700;color:#9a7060;flex-shrink:0}
.pay-select{background:#2a1507;border:1px solid #5a3020;color:#f2d9c0;border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;flex:1;min-width:120px}
.pay-select:focus{border-color:#c8704a}
.pay-toggle{display:flex;align-items:center;gap:6px;margin-right:auto;flex-shrink:0}
.pay-toggle label{font-size:13px;font-weight:700;color:#9a7060;cursor:pointer}
.pay-toggle input[type=checkbox]{width:38px;height:20px;appearance:none;background:#2a1507;border:1.5px solid #5a3020;border-radius:12px;cursor:pointer;position:relative;transition:all .2s;flex-shrink:0}
.pay-toggle input[type=checkbox]:checked{background:#1a7a28;border-color:#2a9a38}
.pay-toggle input[type=checkbox]::after{content:'';position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#9a7060;transition:all .2s}
.pay-toggle input[type=checkbox]:checked::after{background:#fff;right:auto;left:2px}
/* ACTIONS */
.oc-acts{padding:10px 16px;border-top:1px solid #2a1507;display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:5px;border:none;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap}
.act:hover{opacity:.8}
.act-wa{background:#1a3a1a;color:#5af080;border:1px solid #2a6a2a}
.act-mail{background:#1a1a3a;color:#70a0f8;border:1px solid #2a3a6a}
.note-box{padding:10px 16px;background:#150a04;border-top:1px solid #2a1507;font-size:13px;color:#9a7060;font-style:italic}
.note-box strong{color:#c8704a;font-style:normal}
/* CUSTOMER MODAL */
#custModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:16px}
#custModal.on{display:flex}
.cm-box{background:#1a0c05;border:1.5px solid #c8704a;border-radius:20px;padding:0;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.cm-hdr{padding:20px;border-bottom:1px solid #2a1507;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#1a0c05;border-radius:20px 20px 0 0}
.cm-avatar{width:54px;height:54px;border-radius:50%;background:#2a1507;border:2px solid #c8704a;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.cm-info{flex:1;min-width:0}
.cm-name{font-size:18px;font-weight:800}
.cm-sub{font-size:13px;color:#9a7060;margin-top:3px}
.cm-close{background:none;border:1.5px solid #5a3020;color:#9a7060;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.cm-close:hover{color:#e07050;border-color:#e07050}
.cm-section{padding:14px 20px;border-bottom:1px solid #1a0c05}
.cm-section h4{font-size:12px;font-weight:800;color:#6a4030;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.cm-stat-row{display:flex;gap:10px;flex-wrap:wrap}
.cm-stat{background:#2a1507;border-radius:10px;padding:8px 14px;text-align:center;flex:1;min-width:80px}
.cm-stat-v{font-size:20px;font-weight:800;color:#c8704a}.cm-stat-l{font-size:10px;color:#9a7060;margin-top:2px}
.cm-orders{padding:14px 20px}
.cm-orders h4{font-size:12px;font-weight:800;color:#6a4030;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.cm-order-row{padding:10px;background:#2a1507;border-radius:10px;margin-bottom:8px}
.cm-order-date{font-size:12px;color:#9a7060}.cm-order-sum{font-size:14px;font-weight:700}
.cm-order-status{font-size:11px;font-weight:700;color:#c8704a}
/* MESSAGES / SETTINGS */
.form-group{margin-bottom:14px}
.form-label{font-size:13px;font-weight:700;color:#9a7060;margin-bottom:6px;display:block}
.form-input{width:100%;background:#2a1507;border:1.5px solid #5a3020;color:#f2d9c0;border-radius:10px;padding:10px 13px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.form-input:focus{border-color:#c8704a}
.form-textarea{resize:vertical;min-height:100px}
.form-btn{background:linear-gradient(135deg,#c8704a,#e8905a);border:none;border-radius:11px;padding:11px 20px;font-size:14px;font-weight:800;color:#fff;font-family:inherit;cursor:pointer;transition:opacity .2s}
.form-btn:hover{opacity:.85}.form-btn.sec{background:#2a1507;color:#c8704a;border:1.5px solid #5a3020}
.tpl-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tpl{background:#2a1507;border:1px solid #5a3020;color:#9a7060;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s}
.tpl:hover{border-color:#c8704a;color:#c8704a}
.set-msg{font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
.set-msg.ok{color:#3a9a50}.set-msg.err{color:#e07050}
.cust-wrap{position:relative}
.cust-drop{position:absolute;top:100%;right:0;left:0;background:#1c0f07;border:1.5px solid #5a3020;border-radius:12px;margin-top:4px;z-index:50;display:none;max-height:220px;overflow:auto}
.cust-drop.on{display:block}
.cust-row{padding:10px 14px;cursor:pointer;border-bottom:1px solid #2a1507}
.cust-row:last-child{border-bottom:none}.cust-row:hover{background:#2a1507}
.cust-row-name{font-size:14px;font-weight:700}.cust-row-sub{font-size:12px;color:#9a7060;margin-top:2px}
.sel-cust-card{background:#2a1507;border-radius:12px;padding:12px 16px;margin-top:10px;display:none}
.empty-state{text-align:center;padding:60px 20px;color:#7a5040}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state .es-txt{font-size:16px;font-weight:700}.empty-state .es-sub{font-size:13px;color:#5a3020;margin-top:6px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#c8704a;color:#fff;font-size:14px;font-weight:700;border-radius:12px;padding:12px 22px;z-index:9999;transition:transform .35s;pointer-events:none;white-space:nowrap}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{background:#c83030}#toast.warn{background:#a06020}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="lc">
    <div class="lc-logo">🍰</div>
    <div class="lc-title">שרה — ניהול</div>
    <div class="lc-sub">כניסה למנהלת בלבד</div>
    <input type="text" id="uInput" placeholder="שם משתמש" autocomplete="username">
    <input type="password" id="pInput" placeholder="סיסמא" autocomplete="current-password">
    <button class="lc-btn" id="loginBtn" onclick="doLogin()">כניסה</button>
    <div class="lc-msg" id="lMsg"></div>
    <div class="lc-back"><a href="index.html">← חזרה לאתר</a></div>
  </div>
</div>
<div id="dash">
  <div class="hdr">
    <div class="hdr-logo">שרה <span>ניהול</span></div>
    <div class="hdr-clock" id="clock"></div>
    <button class="hdr-btn hdr-back" onclick="window.location='index.html'">← אתר</button>
    <button class="hdr-btn hdr-out" onclick="doLogout()">יציאה</button>
  </div>
  <div class="tabs-bar">
    <button class="tb on" onclick="showTab('orders',this)">📋 הזמנות <span class="nb" id="pendingBadge">0</span></button>
    <button class="tb" onclick="showTab('messages',this)">💬 הודעות</button>
    <button class="tb" onclick="showTab('settings',this)">⚙️ הגדרות</button>
  </div>
  <div class="pane" id="pOrders">
    <div class="date-nav">
      <div class="date-arrow" onclick="shiftDate(-1)">›</div>
      <div class="date-center" onclick="toggleDatePicker()">
        <div class="date-main" id="dateMain">היום</div>
        <div class="date-sub" id="dateSub"></div>
      </div>
      <div class="date-arrow" onclick="shiftDate(1)">‹</div>
      <button class="date-btn" id="todayBtn" onclick="goToday()">היום</button>
      <button class="date-btn" id="allBtn" onclick="toggleAll()">הכל</button>
      <input type="date" id="datePicker" onchange="pickDate(this.value)">
    </div>
    <div class="day-sum" id="kpis"></div>
    <div class="sf-bar">
      <button class="sf on" onclick="setFilter('all',this)">הכל</button>
      <button class="sf" onclick="setFilter('pending',this)">⏳ ממתינות</button>
      <button class="sf" onclick="setFilter('confirmed',this)">✅ התקבלה</button>
      <button class="sf" onclick="setFilter('in_progress',this)">🔧 בהכנה</button>
      <button class="sf" onclick="setFilter('ready',this)">🍰 מוכן</button>
      <button class="sf" onclick="setFilter('completed',this)">🏁 הושלם</button>
    </div>
    <div id="ordersList"></div>
  </div>
  <div class="pane" id="pMessages" style="display:none">
    <div class="form-group">
      <div class="form-label">שליחה לכולם</div>
      <div class="tpl-btns">
        <button class="tpl" data-tpl="promo">🎉 מבצע</button>
        <button class="tpl" data-tpl="holiday">🍰 חג</button>
        <button class="tpl" data-tpl="update">📢 עדכון</button>
        <button class="tpl" data-tpl="closed">🔒 סגור</button>
        <button class="tpl" data-tpl="open">✅ פתוח</button>
      </div>
      <textarea class="form-input form-textarea" id="bulkMsg" placeholder="תוכן ההודעה..."></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="form-btn" onclick="sendBulkMail()">📧 מייל לכולם</button>
        <button class="form-btn sec" onclick="copyEmails()">📋 העתק מיילים</button>
      </div>
    </div>
    <hr style="border-color:#2a1507;margin:20px 0">
    <div class="form-group">
      <div class="form-label">שלח ללקוח ספציפי</div>
      <div class="cust-wrap">
        <input type="text" class="form-input" id="custSearch" placeholder="חפש לפי שם / טלפון / מייל...">
        <div class="cust-drop" id="custDrop"></div>
      </div>
      <div class="sel-cust-card" id="selCustCard">
        <div style="font-size:15px;font-weight:800" id="scName"></div>
        <div style="font-size:13px;color:#9a7060;margin-top:3px" id="scSub"></div>
      </div>
      <textarea class="form-input form-textarea" id="custMsg" placeholder="הודעה..." style="margin-top:10px"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="form-btn" onclick="sendCustWa()">💬 WhatsApp</button>
        <button class="form-btn sec" onclick="sendCustMail()">📧 מייל</button>
      </div>
    </div>

  <div class="pane" id="pSettings" style="display:none">

    <div class="form-group"><div class="form-label">מספר WhatsApp</div><input type="text" class="form-input" id="sWa" placeholder="972523394838"></div>
    <div class="form-group"><div class="form-label">שעות פעילות</div><input type="text" class="form-input" id="sHours"></div>
    <div class="form-group"><div class="form-label">בנר הודעה</div><input type="text" class="form-input" id="sBanner"></div>
    <div class="form-group" style="display:flex;align-items:center;gap:10px">
      <input type="checkbox" id="sOrdersOpen" style="width:20px;height:20px;accent-color:#c8704a">
      <label for="sOrdersOpen" style="font-size:14px;font-weight:700;cursor:pointer">קבלת הזמנות פתוחה</label>
    </div>
    <button class="form-btn" id="saveSettingsBtn" onclick="saveSettings()">💾 שמור הגדרות</button>

</div>
<div id="custModal">
  <div class="cm-box">
    <div class="cm-hdr">
      <div class="cm-avatar">👤</div>
      <div class="cm-info">
        <div class="cm-name" id="cmName"></div>
        <div class="cm-sub" id="cmPhone"></div>

<div id="toast"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js';
import{getFirestore,collection,query,orderBy,onSnapshot,doc,updateDoc,deleteDoc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js';

const FB={apiKey:"AIzaSyDUiu7JxAzdjmZS3Dp1A_TESM6fvxdPPaw",authDomain:"sarabakery.firebaseapp.com",projectId:"sarabakery",storageBucket:"sarabakery.firebasestorage.app",messagingSenderId:"595236323371",appId:"1:595236323371:web:e2004d0f0d9cdbab23ea6e"};
const app=initializeApp(FB),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let allOrders=[],allCustomers=[],settings={},curDate=new Date(),curFilter='all',showAll=false,selCust=null;

/* NORMALIZERS */
const oName=o=>(o.name||o.customer?.name||'').trim()||'לקוח לא ידוע';
const oPhone=o=>(o.phone||o.customer?.phone||'').trim();
const oEmail=o=>(o.userEmail||o.customer?.email||o.email||'').trim();
const oNote=o=>(o.notes||o.note||o.checkout?.note||'').trim();
const oItems=o=>Array.isArray(o.items)?o.items:[];
const oTotal=o=>{var it=oItems(o);return o.total||o.totals?.orderTotal||it.reduce((s,i)=>s+(+(i.price||0))*(+(i.qty||1)),0);};
const oIsDelivery=o=>{var m=o.deliveryType||o.checkout?.deliveryMode||o.delivery||'';return m==='delivery'||m==='כן';};
const oAddress=o=>(o.street||o.checkout?.address||o.address||'').trim();
const oCity=o=>(o.city||o.checkout?.deliveryCity||o.checkout?.deliveryCityLabel||'').trim();
function oStatus(o){
  var s=o.status||'';
  if(!s||s==='new'||s==='ממתינה'||s==='pending') return 'pending';
  if(s==='confirmed'||s==='התקבלה') return 'confirmed';
  if(s==='in_progress'||s==='בהכנה') return 'in_progress';
  if(s==='ready'||s==='מוכן'||s==='מוכנה') return 'ready';
  if(s==='completed'||s==='הושלם'||s==='נאספה'||s==='נמסרה') return 'completed';
  if(s==='cancelled'||s==='בוטל') return 'cancelled';
  return 'pending';
}
function parseReadyBy(o){
  var raw=o.readyBy||o.checkout?.readyBy||o.deliveryDate||'';
  if(!raw) return{date:'',time:'',dateKey:'',raw:''};
  var str=String(raw).replace(/[‏‎‪-‮]/g,'');
  var m=str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[^\d]*(\d{1,2}:\d{2}))?/);
  if(m){var d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0'),y=m[3];return{date:d+'/'+mo+'/'+y,time:m[4]||'',dateKey:y+'-'+mo+'-'+d,raw:str};}
  if(/^\d{4}-\d{2}-\d{2}/.test(str)){var dk=str.slice(0,10),p=dk.split('-');return{date:p[2]+'/'+p[1]+'/'+p[0],time:o.deliveryTime||o.checkout?.deliveryTime||'',dateKey:dk,raw:str};}
  return{date:str,time:'',dateKey:'',raw:str};
}
function normPhone(p){if(!p)return'';var n=String(p).replace(/\D/g,'');if(n.startsWith('0'))n='972'+n.slice(1);return n;}
function fmtKey(d){var x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1).toString().padStart(2,'0')+'-'+x.getDate().toString().padStart(2,'0');}
function todayKey(){return fmtKey(new Date());}
function createdKey(o){var ca=o.createdAt?.toDate?o.createdAt.toDate():(o.createdAt?new Date(o.createdAt):null);return ca&&!isNaN(ca)?fmtKey(ca):'';}
function matchesDate(o,date){var rb=parseReadyBy(o);var ds=fmtKey(date);if(rb.dateKey)return rb.dateKey===ds;return createdKey(o)===ds;}
function sortKey(o){var rb=parseReadyBy(o);if(rb.dateKey)return rb.dateKey+(rb.time||'99:99');return(createdKey(o)||'9999-99-99')+'99:99';}
function hebrewDay(d){return['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'][new Date(d).getDay()];}

const SF=[{k:'pending',l:'ממתינה',i:'⏳'},{k:'confirmed',l:'התקבלה',i:'✅'},{k:'in_progress',l:'בהכנה',i:'🔧'},{k:'ready',l:'מוכן',i:'🍰'},{k:'completed',l:'הושלם',i:'🏁'}];

let toastT;
function toast(msg,type=''){var t=$('toast');t.textContent=msg;t.className='on '+(type||'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',3200);}
function updateClock(){$('clock').textContent=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});}
setInterval(updateClock,15000);updateClock();

/* AUTH */
const USERS={'sara':'sara@sara.local','admin':'sara@sara.local','שרה':'sara@sara.local','שרהחברוני':'sara@sara.local'};
window.doLogin=async function(){
  var btn=$('loginBtn'),msg=$('lMsg');
  var u=$('uInput').value.trim(),p=$('pInput').value;
  if(!u||!p){msg.textContent='נא למלא שם משתמש וסיסמא';return;}
  var email=USERS[u]||u;
  btn.disabled=true;btn.textContent='⏳ מתחבר...';msg.textContent='';
  try{await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,email,p);}
  catch(e){msg.textContent=e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'?'סיסמא שגויה':'שגיאה: '+e.message;btn.disabled=false;btn.textContent='כניסה';}
};
window.doLogout=async function(){await signOut(auth);};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('loginScreen').style.display!=='none')window.doLogin();});

onAuthStateChanged(auth,user=>{
  if(user){$('loginScreen').style.display='none';$('dash').classList.add('on');initDash();}
  else{$('loginScreen').style.display='';$('dash').classList.remove('on');}
});

/* INIT */
let unsubOrders=null;
function initDash(){
  renderDateNav();
  if(unsubOrders)unsubOrders();
  var q=query(collection(db,'orders'),orderBy('createdAt','desc'));
  unsubOrders=onSnapshot(q,snap=>{
    allOrders=snap.docs.map(d=>({id:d.id,...d.data()}));
    buildCustomers();renderOrders();renderKpis();updateBadge();
  });
  loadSettings();
}

function buildCustomers(){
  var map={};
  allOrders.forEach(o=>{
    var ph=normPhone(oPhone(o));
    var key=ph||oEmail(o)||oName(o);
    if(!key||key==='לקוח לא ידוע')return;
    if(!map[key])map[key]={id:key,fullName:oName(o),phone:oPhone(o),email:oEmail(o),orders:[]};
    map[key].orders.push(o);
    if(oName(o)&&oName(o)!=='לקוח לא ידוע')map[key].fullName=oName(o);
    if(oEmail(o))map[key].email=oEmail(o);
  });
  allCustomers=Object.values(map);
}

/* RENDER */
function renderOrders(){
  var list=showAll?[...allOrders]:allOrders.filter(o=>matchesDate(o,curDate));
  if(curFilter!=='all')list=list.filter(o=>oStatus(o)===curFilter);
  list.sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
  if(!list.length){
    $('ordersList').innerHTML=`<div class="empty-state"><div class="es-icon">📭</div><div class="es-txt">אין הזמנות</div><div class="es-sub">${showAll?'':'נסי תאריך אחר'}</div></div>`;
    return;
  }
  if(showAll){
    var groups={};
    list.forEach(o=>{var rb=parseReadyBy(o);var dk=rb.dateKey||createdKey(o)||'ללא תאריך';if(!groups[dk])groups[dk]=[];groups[dk].push(o);});
    var sk=Object.keys(groups).sort();
    $('ordersList').innerHTML=sk.map(dk=>{
      var p=dk.split('-');var label=dk==='ללא תאריך'?dk:(p[2]+'/'+p[1]+'/'+p[0]);
      return`<div style="margin-bottom:6px;padding:6px 10px;background:#150a04;border-radius:10px;font-size:13px;font-weight:700;color:#c8704a">📅 ${label} — ${groups[dk].length} הזמנות</div>${groups[dk].map(renderCard).join('')}`;
    }).join('');
  }else{
    $('ordersList').innerHTML=list.map(renderCard).join('');
  }
}

function renderCard(o){
  var s=oStatus(o);
  var rb=parseReadyBy(o);
  var name=oName(o);
  var phone=oPhone(o);
  var email=oEmail(o);
  var items=oItems(o);
  var total=oTotal(o);
  var isDelivery=oIsDelivery(o);
  var note=oNote(o);
  var num=o.orderNum||o.id||'';
  var initials=name!=='לקוח לא ידוע'?name.trim().split(' ').map(w=>w[0]||'').join('').slice(0,2):'?';

  var timingHtml='';
  if(rb.time||rb.date){
    timingHtml=`<div class="oc-timing">
      ${rb.time?`<div class="oc-timing-time">${rb.time}</div>`:''}
      <div class="oc-timing-date">${rb.date||''}</div>
      <div class="oc-timing-mode">${isDelivery?'🚗 משלוח':'🏠 איסוף'}</div>
    </div>`;
  }

  var curIdx=SF.findIndex(x=>x.k===s);
  var stepperHtml='';
  if(s==='cancelled'){
    stepperHtml=`<div class="stepper-wrap">
      <div class="status-cancelled">❌ הזמנה בוטלה</div>
      <div class="action-row">
        <button class="act-sm act-delete" onclick="window._delete('${o.id}')">🗑️ מחק לצמיתות</button>
      </div>
    </div>`;
  }else{
    var steps=SF.map((step,i)=>{
      var isDone=i<curIdx,isCur=i===curIdx,isNext=i===curIdx+1;
      var cls=isDone?'done':isCur?'current':isNext?'next':'future';
      var line=i<SF.length-1?`<div class="sl ${isDone?'done':''}"></div>`:'';
      return`<div class="ss ${cls}"><div class="sd">${isDone?'✓':step.i}</div><div class="slb">${step.l}</div></div>${line}`;
    }).join('');
    var nextStep=curIdx>=0&&curIdx<SF.length-1?SF[curIdx+1]:null;
    var advBtn=nextStep
      ?`<button class="adv-btn" onclick="window._adv('${o.id}')">קדם → ${nextStep.l} ${nextStep.i}</button>`
      :`<div class="status-done">✅ הזמנה הושלמה</div>`;
    stepperHtml=`<div class="stepper-wrap">
      <div class="stepper">${steps}</div>
      ${advBtn}
      <div class="action-row">
        ${s!=='completed'?`<button class="act-sm act-cancel" onclick="window._cancel('${o.id}')">⛔ ביטול הזמנה</button>`:''}
        <button class="act-sm act-delete" onclick="window._delete('${o.id}')">🗑️ מחק</button>
      </div>
    </div>`;
  }

  var itemsHtml='';
  if(items.length){
    var rows=items.map(it=>{
      if(!it)return'';
      var details=[it.size,it.flavor,it.color,it.filling,it.decoration,it.details,it.note,it.inscription].filter(Boolean).join(' · ');
      return`<div class="item-row">
        <div class="item-qty">${it.qty||1}x</div>
        <div class="item-name">${it.name||'פריט'}<br>${details?`<span class="item-details">${details}</span>`:''}</div>
        <div class="item-price">₪${((it.price||0)*(it.qty||1)).toFixed(0)}</div>
      </div>`;
    }).join('');
    itemsHtml=`<div class="oc-items">
      <div class="items-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('on')">
        <span>🛒 ${items.length} פריטים — ₪${(+total).toFixed(0)}</span>
        <span style="margin-right:auto;font-size:11px;color:#6a4030">לפרטים ▼</span>
      </div>
      <div class="items-list">${rows}</div>
    </div>`;
  }

  var payMethod=o.paymentMethod||o.checkout?.payment||o.checkout?.paymentCode||'';
  var isPaid=o.paid===true;
  var payHtml=`<div class="oc-pay">
    <span class="pay-label">💰 תשלום:</span>
    <select class="pay-select" onchange="window._setPay('${o.id}',this.value)">
      <option value="" ${!payMethod?'selected':''}>— בחר —</option>
      <option value="cash" ${'cash'===payMethod?'selected':''}>מזומן</option>
      <option value="bit" ${'bit'===payMethod||payMethod==='ביט'?'selected':''}>ביט</option>
      <option value="paybox" ${'paybox'===payMethod||payMethod==='פייבוקס'?'selected':''}>פייבוקס</option>
      <option value="transfer" ${'transfer'===payMethod||payMethod==='העברה'?'selected':''}>העברה</option>
    </select>
    <div class="pay-toggle">
      <input type="checkbox" id="paid_${o.id}" ${isPaid?'checked':''} onchange="window._setPaid('${o.id}',this.checked)">
      <label for="paid_${o.id}">${isPaid?'✅ שילם':'⏳ לא שילם'}</label>
    </div>
  </div>`;

  var waLink=phone?`<a class="act act-wa" href="https://wa.me/${normPhone(phone)}?text=${encodeURIComponent('שלום '+name+' 😊')}" target="_blank">💬 ${phone}</a>`:'';
  var mailLink=email?`<a class="act act-mail" href="mailto:${email}">📧 ${email}</a>`:'';

  var addrHtml='';
  if(isDelivery){var addr=[oAddress(o),oCity(o)].filter(Boolean).join(', ');if(addr)addrHtml=`<div class="note-box"><strong>📍 משלוח:</strong> ${addr}</div>`;}
  var noteHtml=note?`<div class="note-box"><strong>📝 הערה:</strong> ${note}</div>`:'';

  return`<div class="oc ${s==='pending'?'urgent':''}">
    <div class="oc-hdr">
      <div class="oc-avatar" onclick="window._profile('${o.id}')">${initials}</div>
      <div class="oc-id">
        <div class="oc-name" onclick="window._profile('${o.id}')">${name} <span class="oc-name-hint">← פרופיל</span></div>
        <div class="oc-meta">
          ${phone?`<span class="oc-contact">📱 ${phone}</span>`:''}
          ${num?`<span class="oc-num">#${num}</span>`:''}
        </div>
      </div>
      ${timingHtml}
    </div>
    ${stepperHtml}
    ${itemsHtml}
    ${addrHtml}
    ${noteHtml}
    ${payHtml}
    ${waLink||mailLink?`<div class="oc-acts">${waLink}${mailLink}</div>`:''}
  </div>`;
}

function renderKpis(){
  var today=todayKey();
  var dayList=showAll?allOrders:allOrders.filter(o=>matchesDate(o,curDate));
  var todayNew=allOrders.filter(o=>createdKey(o)===today).length;
  var pending=dayList.filter(o=>oStatus(o)==='pending').length;
  var rev=dayList.reduce((s,o)=>s+(+oTotal(o)||0),0);
  var del=dayList.filter(oIsDelivery).length;
  $('kpis').innerHTML=`
    <div class="ds"><div class="ds-v">${dayList.length}</div><div class="ds-l">${showAll?'סה"כ':'הזמנות'}</div></div>
    <div class="ds"><div class="ds-v">${pending}</div><div class="ds-l">ממתינות</div></div>
    <div class="ds"><div class="ds-v">${todayNew}</div><div class="ds-l">נכנסו היום</div></div>
    <div class="ds"><div class="ds-v">${allOrders.length}</div><div class="ds-l">סה"כ כל הזמנות</div></div>
    <div class="ds"><div class="ds-v">₪${rev.toFixed(0)}</div><div class="ds-l">הכנסות</div></div>
    <div class="ds"><div class="ds-v">${del}</div><div class="ds-l">משלוחים</div></div>`;
}
function updateBadge(){$('pendingBadge').textContent=allOrders.filter(o=>oStatus(o)==='pending').length;}

/* DATE NAV */
function renderDateNav(){
  if(showAll){$('dateMain').textContent='כל ההזמנות';$('dateSub').textContent='';$('allBtn').classList.add('active');$('todayBtn').classList.remove('active');}
  else{
    var today=new Date();today.setHours(0,0,0,0);var d=new Date(curDate);d.setHours(0,0,0,0);
    var diff=Math.round((d-today)/864e5);
    var label=diff===0?'היום':diff===1?'מחר':diff===-1?'אתמול':null;
    $('dateMain').textContent=label||d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});
    $('dateSub').textContent='יום '+hebrewDay(curDate);
    $('todayBtn').classList.toggle('active',diff===0);$('allBtn').classList.remove('active');
  }
}
window.shiftDate=d=>{showAll=false;var x=new Date(curDate);x.setDate(x.getDate()+d);curDate=x;renderDateNav();renderOrders();renderKpis();};
window.goToday=()=>{showAll=false;curDate=new Date();renderDateNav();renderOrders();renderKpis();};
window.toggleAll=()=>{showAll=!showAll;renderDateNav();renderOrders();renderKpis();};
window.toggleDatePicker=()=>{var p=$('datePicker');p.classList.toggle('on');if(p.classList.contains('on'))p.value=fmtKey(curDate);};
window.pickDate=v=>{if(!v)return;showAll=false;curDate=new Date(v+'T00:00:00');$('datePicker').classList.remove('on');renderDateNav();renderOrders();renderKpis();};
window.setFilter=function(f,btn){curFilter=f;document.querySelectorAll('.sf').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');renderOrders();};
window.showTab=function(tab,btn){['pOrders','pMessages','pSettings'].forEach(p=>$(p).style.display='none');document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));$('p'+tab[0].toUpperCase()+tab.slice(1)).style.display='';if(btn)btn.classList.add('on');};

/* ADVANCE STATUS */
window._adv=async function(orderId){
  var order=allOrders.find(o=>o.id===orderId);if(!order)return;
  var cur=oStatus(order);var idx=SF.findIndex(x=>x.k===cur);
  if(idx<0||idx>=SF.length-1)return;
  var next=SF[idx+1].k;
  try{
    await updateDoc(doc(db,'orders',orderId),{status:next,updatedAt:serverTimestamp()});
    var i=allOrders.findIndex(o=>o.id===orderId);if(i!==-1)allOrders[i].status=next;
    renderOrders();renderKpis();updateBadge();toast('עברת ל: '+SF[idx+1].l);sendWA(order,next);
  }catch(e){toast('שגיאה: '+e.message,'err');}
};

/* CANCEL */
window._cancel=async function(orderId){
  if(!confirm('לבטל הזמנה זו?\nהשעה תשוחרר ותהיה פנויה שוב.'))return;
  try{
    await updateDoc(doc(db,'orders',orderId),{status:'cancelled',updatedAt:serverTimestamp()});
    var i=allOrders.findIndex(o=>o.id===orderId);if(i!==-1)allOrders[i].status='cancelled';
    renderOrders();renderKpis();updateBadge();toast('הזמנה בוטלה — השעה שוחררה','warn');
  }catch(e){toast('שגיאה','err');}
};

/* DELETE */
window._delete=async function(orderId){
  var order=allOrders.find(o=>o.id===orderId);
  var rb=parseReadyBy(order||{});
  var timeInfo=rb.date&&rb.time?` (${rb.date} ${rb.time})`:'';
  if(!confirm('למחוק הזמנה זו לצמיתות?'+timeInfo+'\nהשעה תשתחרר לחלוטין ותהיה פנויה להזמנות חדשות.'))return;
  try{
    await deleteDoc(doc(db,'orders',orderId));
    allOrders=allOrders.filter(o=>o.id!==orderId);
    buildCustomers();renderOrders();renderKpis();updateBadge();toast('הזמנה נמחקה — השעה פנויה ✓');
  }catch(e){toast('שגיאת מחיקה: '+e.message,'err');}
};

/* PAYMENT */
window._setPay=async function(orderId,method){
  try{await updateDoc(doc(db,'orders',orderId),{paymentMethod:method,updatedAt:serverTimestamp()});var i=allOrders.findIndex(o=>o.id===orderId);if(i!==-1)allOrders[i].paymentMethod=method;}
  catch(e){toast('שגיאת שמירה','err');}
};
window._setPaid=async function(orderId,paid){
  try{await updateDoc(doc(db,'orders',orderId),{paid,updatedAt:serverTimestamp()});var i=allOrders.findIndex(o=>o.id===orderId);if(i!==-1)allOrders[i].paid=paid;toast(paid?'✅ סומן כשולם':'⏳ לא שולם');}
  catch(e){toast('שגיאת שמירה','err');}
};

/* WHATSAPP */
function sendWA(o,newStatus){
  var phone=normPhone(oPhone(o));if(!phone)return;
  var name=oName(o);var rb=parseReadyBy(o);
  var now=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  var msg='';
  if(newStatus==='confirmed')msg=`שלום ${name}! ✅\nההזמנה שלך התקבלה בשעה ${now} 🎉\nנעדכן אותך כשתהיה מוכנה!`;
  else if(newStatus==='ready'){
    if(oIsDelivery(o))msg=`שלום ${name}! 🚗\nההזמנה שלך יצאה למשלוח ובדרך אליך!${rb.time?' ⏰ '+rb.time:''}`;
    else msg=`שלום ${name}! 🍰\nההזמנה שלך מוכנה ומחכה לך!\n${settings.address?'📍 '+settings.address+'\n':''}${rb.time?'⏰ זמן איסוף: '+rb.time:''}`.trim();
  }
  if(msg)window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
}

/* CUSTOMER PROFILE */
window._profile=function(orderId){
  var o=allOrders.find(x=>x.id===orderId);if(!o)return;
  var phone=normPhone(oPhone(o));
  var custOrders=allOrders.filter(x=>{
    var xp=normPhone(oPhone(x));
    if(phone&&xp===phone)return true;
    if(oEmail(x)&&oEmail(x)===oEmail(o))return true;
    return false;
  }).sort((a,b)=>sortKey(b).localeCompare(sortKey(a)));
  var total=custOrders.reduce((s,x)=>s+(+oTotal(x)||0),0);
  var name=oName(o),ph=oPhone(o),email=oEmail(o);
  $('cmName').textContent=name;
  $('cmPhone').textContent=ph?'📱 '+ph:'אין טלפון';
  $('cmEmail').textContent=email?'📧 '+email:'';
  $('cmStats').innerHTML=`<div class="cm-stat"><div class="cm-stat-v">${custOrders.length}</div><div class="cm-stat-l">הזמנות</div></div><div class="cm-stat"><div class="cm-stat-v">₪${total.toFixed(0)}</div><div class="cm-stat-l">סה"כ</div></div>`;
  $('cmWaBtn').href=ph?'https://wa.me/'+normPhone(ph):'#';
  $('cmMailBtn').href=email?'mailto:'+email:'#';
  $('cmOrders').innerHTML=`<h4>היסטוריה</h4>`+custOrders.map(x=>{
    var rb=parseReadyBy(x);var st=oStatus(x);
    var stL={'pending':'⏳ ממתינה','confirmed':'✅ התקבלה','in_progress':'🔧 בהכנה','ready':'🍰 מוכן','completed':'🏁 הושלם','cancelled':'❌ בוטל'}[st]||st;
    return`<div class="cm-order-row"><div class="cm-order-date">${rb.date||createdKey(x)||''}${rb.time?' ⏰ '+rb.time:''}</div><div class="cm-order-sum">₪${(+oTotal(x)).toFixed(0)} — ${oItems(x).length} פריטים</div><div class="cm-order-status">${stL}</div></div>`;
  }).join('');
  $('custModal').classList.add('on');
};
window.closeCustModal=()=>$('custModal').classList.remove('on');
$('custModal').addEventListener('click',e=>{if(e.target===$('custModal'))window.closeCustModal();});

/* SETTINGS */
async function loadSettings(){
  try{var s=await getDoc(doc(db,'settings','main'));settings=s.exists()?s.data():{};
    $('sAddr').value=settings.address||'';$('sWa').value=settings.whatsapp||'972523394838';
    $('sHours').value=settings.hours||'';$('sBanner').value=settings.banner||'';
    $('sOrdersOpen').checked=settings.ordersClosed!==true;
  }catch(e){}
}
window.saveSettings=async function(){
  var btn=$('saveSettingsBtn'),msg=$('setMsg');btn.disabled=true;btn.textContent='⏳...';msg.textContent='';
  try{var data={address:$('sAddr').value.trim(),whatsapp:$('sWa').value.trim(),hours:$('sHours').value.trim(),banner:$('sBanner').value.trim(),ordersClosed:!$('sOrdersOpen').checked,updatedAt:serverTimestamp()};
    await setDoc(doc(db,'settings','main'),data,{merge:true});settings={...settings,...data};msg.textContent='✅ נשמר';msg.className='set-msg ok';toast('הגדרות נשמרו');
  }catch(e){msg.textContent='שגיאה';msg.className='set-msg err';}
  btn.disabled=false;btn.textContent='💾 שמור';setTimeout(()=>msg.textContent='',4000);
};

/* MESSAGES */
const TMPLS={promo:'🎉 מבצע מיוחד!\n[תיאור]\nתקף עד [תאריך] 🍰',holiday:'🍰 חג שמח!\nשרה מאחלת לכם חג שמח ומתוק ❤️',update:'📢 עדכון:\n[כתבי]\n\nשרה 🍰',closed:'🔒 הזמנות סגורות זמנית.\nנחזור בקרוב! 🙏',open:'✅ חזרנו!\nמקבלות הזמנות 🍰'};
document.querySelectorAll('.tpl').forEach(b=>b.addEventListener('click',()=>{if(TMPLS[b.dataset.tpl])$('bulkMsg').value=TMPLS[b.dataset.tpl];}));
window.sendBulkMail=()=>{var em=allCustomers.map(c=>c.email).filter(Boolean).join(';');if(!em){toast('אין מיילים','warn');return;}location.href='mailto:?bcc='+encodeURIComponent(em)+'&subject='+encodeURIComponent('הודעה מ-שרה 🍰')+'&body='+encodeURIComponent(($('bulkMsg').value||'').trim());};
window.copyEmails=()=>{var em=allCustomers.map(c=>c.email).filter(Boolean).join(', ');if(!em){toast('אין מיילים','warn');return;}navigator.clipboard.writeText(em).then(()=>toast('הועתק ✓')).catch(()=>prompt('העתק:',em));};
$('custSearch').addEventListener('input',function(){
  var q=this.value.trim().toLowerCase();if(!q){$('custDrop').classList.remove('on');return;}
  var r=allCustomers.filter(c=>(c.fullName||'').toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.email||'').toLowerCase().includes(q));
  if(!r.length){$('custDrop').classList.remove('on');return;}
  $('custDrop').innerHTML=r.slice(0,6).map(c=>`<div class="cust-row" onclick="window._selCust('${c.id}')"><div class="cust-row-name">${c.fullName||c.email||'לקוח'}</div><div class="cust-row-sub">${[c.phone,c.email].filter(Boolean).join(' · ')}</div></div>`).join('');
  $('custDrop').classList.add('on');
});
document.addEventListener('click',e=>{if(!e.target.closest('.cust-wrap'))$('custDrop').classList.remove('on');});
window._selCust=function(id){selCust=allCustomers.find(c=>c.id===id);if(!selCust)return;$('custSearch').value='';$('custDrop').classList.remove('on');$('selCustCard').style.display='block';$('scName').textContent=selCust.fullName||'לקוח';$('scSub').textContent=[selCust.phone,selCust.email].filter(Boolean).join(' · ');};
window.sendCustWa=()=>{if(!selCust){toast('בחרי לקוח','warn');return;}var ph=normPhone(selCust.phone);if(!ph){toast('אין מספר','warn');return;}window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(($('custMsg').value||'').trim()),'_blank');};
window.sendCustMail=()=>{if(!selCust){toast('בחרי לקוח','warn');return;}if(!selCust.email){toast('אין מייל','warn');return;}location.href='mailto:'+selCust.email+'?subject='+encodeURIComponent('הודעה מ-שרה 🍰')+'&body='+encodeURIComponent(($('custMsg').value||'').trim());};
</script>
