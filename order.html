<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>מעקב הזמנה – שרה בייקרי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Rubik:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --brown:#2d1a0e;--brown-mid:#7a5040;--copper:#c8704a;--copper-dark:#a8522e;
  --cream:#fffaf3;--warm1:#fdecd8;--warm2:#f2d9c0;--green:#27ae60;--blue:#2980b9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rubik,sans-serif;background:linear-gradient(160deg,#fffaf3 0%,#fdecd8 60%,#f5d4b8 100%);min-height:100vh;direction:rtl;color:var(--brown)}
a{text-decoration:none;color:inherit}

/* NAV */
.nav{background:linear-gradient(135deg,#1a0a04 0%,#2e1408 50%,#1e0c05 100%);padding:0 5%;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.nav-logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:#fff;display:flex;align-items:center;gap:8px;letter-spacing:.4px}
.nav-back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:rgba(240,200,150,.85);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:7px 14px;border-radius:20px;cursor:pointer;transition:all .2s}
.nav-back:hover{background:rgba(255,255,255,.18);color:#fff}

/* HERO */
.hero{background:linear-gradient(135deg,#1a0a04 0%,#3a1808 40%,#2a1206 100%);padding:36px 20px 30px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:-30%;background:radial-gradient(circle at 30% 50%,rgba(200,112,74,.25),transparent 55%),radial-gradient(circle at 70% 30%,rgba(216,177,106,.2),transparent 50%);pointer-events:none}
.hero-emoji{font-size:52px;margin-bottom:10px;display:block;position:relative;filter:drop-shadow(0 6px 16px rgba(200,112,74,.5))}
.hero-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:#fff;margin-bottom:6px;position:relative}
.hero-num{font-family:'Playfair Display',serif;font-size:16px;color:rgba(240,190,130,.75);position:relative;font-weight:700;letter-spacing:1px}
.hero-status-badge{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:8px 20px;border-radius:999px;font-size:13px;font-weight:800;position:relative}

/* WRAP */
.wrap{max-width:600px;margin:0 auto;padding:22px 16px 80px}

/* CARD */
.card{background:#fff;border-radius:20px;border:1.5px solid var(--warm2);padding:20px;margin-bottom:14px;box-shadow:0 4px 18px rgba(200,112,74,.08)}
.card-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:900;color:var(--brown);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--warm1);display:flex;align-items:center;gap:7px}
.card-title-icon{font-size:18px}

/* TIMELINE */
.timeline{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 0 4px;gap:0}
.tl-step{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;position:relative}
.tl-step:not(:last-child)::after{content:'';position:absolute;top:18px;right:-50%;width:100%;height:2px;background:var(--warm2);z-index:0}
.tl-step.done:not(:last-child)::after{background:linear-gradient(90deg,var(--copper),#f0c878)}
.tl-dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--warm2);background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;z-index:1;transition:all .4s}
.tl-step.done .tl-dot{border-color:var(--green);background:linear-gradient(135deg,#e8f8ee,#d4f4e2)}
.tl-step.active .tl-dot{border-color:var(--copper);background:linear-gradient(135deg,#fff0e8,#ffe0cc);box-shadow:0 0 0 4px rgba(200,112,74,.2),0 4px 12px rgba(200,112,74,.3);animation:pulse 2s ease infinite}
.tl-step.cancelled .tl-dot{border-color:#e74c3c;background:#fef0f0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(200,112,74,.2),0 4px 12px rgba(200,112,74,.25)}50%{box-shadow:0 0 0 8px rgba(200,112,74,.08),0 4px 16px rgba(200,112,74,.35)}}
.tl-label{font-size:10px;font-weight:800;color:var(--brown-mid);text-align:center;letter-spacing:.2px;line-height:1.3}
.tl-step.active .tl-label{color:var(--copper)}
.tl-step.done .tl-label{color:var(--green)}

/* STATUS BANNER */
.status-banner{border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:14px}
.status-banner .sb-icon{font-size:26px;flex-shrink:0}
.status-banner .sb-title{font-size:15px;font-weight:900;margin-bottom:2px}
.status-banner .sb-sub{font-size:12px;font-weight:700;opacity:.75}
.sb-new{background:linear-gradient(135deg,#e8f8ee,#d4f4e2);border:1.5px solid #90d8a8;color:#1a6a3a}
.sb-seen{background:linear-gradient(135deg,#e8f4ff,#d0e8ff);border:1.5px solid #90b8f0;color:#1a4080}
.sb-preparing{background:linear-gradient(135deg,#fff3e0,#ffe8c0);border:1.5px solid #f0a050;color:#7a3a00}
.sb-ready{background:linear-gradient(135deg,#e8fff0,#c8f8dc);border:1.5px solid #50c878;color:#0a5020}
.sb-delivered,.sb-done{background:linear-gradient(135deg,#f0e8ff,#e0d0ff);border:1.5px solid #b090e8;color:#4a1888}
.sb-cancelled{background:linear-gradient(135deg,#fff0f0,#ffe0e0);border:1.5px solid #f09090;color:#801818}

/* ITEMS */
.order-item{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--warm2)}
.order-item:last-child{border-bottom:none}
.order-item-name{font-size:14px;font-weight:800;color:var(--brown)}
.order-item-details{font-size:12px;color:var(--brown-mid);margin-top:3px;font-weight:600}
.order-item-price{font-family:'Playfair Display',serif;font-size:15px;font-weight:900;color:var(--copper);white-space:nowrap;margin-right:12px;flex-shrink:0}
.totals-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--brown-mid);margin-top:8px;padding-top:8px;border-top:1px solid var(--warm1)}
.totals-row.final{font-size:16px;font-weight:900;color:var(--brown);margin-top:10px;padding-top:10px;border-top:2px solid var(--warm2)}
.totals-val{font-family:'Playfair Display',serif;color:var(--copper)}

/* DETAIL ROWS */
.detail-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--warm1)}
.detail-row:last-child{border-bottom:none}
.detail-icon{font-size:17px;flex-shrink:0;margin-top:1px}
.detail-label{font-size:11px;color:var(--brown-mid);font-weight:700;margin-bottom:2px}
.detail-val{font-size:13px;font-weight:800;color:var(--brown)}

/* CHANGE REQUEST */
.change-box{border-radius:20px;overflow:hidden;margin-bottom:14px}
.change-active{background:linear-gradient(135deg,#1a0a04,#2e1408);border:1.5px solid rgba(200,112,74,.4)}
.change-expired{background:#f5ece5;border:1.5px solid var(--warm2)}
.change-head{padding:18px 18px 14px;display:flex;align-items:center;gap:12px}
.change-icon{font-size:30px;flex-shrink:0}
.change-title{font-size:15px;font-weight:900;color:#fff;margin-bottom:3px}
.change-title.expired{color:var(--brown-mid)}
.change-sub{font-size:12px;color:rgba(255,220,170,.65);font-weight:700}
.change-sub.expired{color:#b09080}
.change-body{padding:0 18px 18px}
.change-countdown{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.countdown-num{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:#f0c070;min-width:38px;text-align:center}
.countdown-sep{font-size:22px;color:rgba(240,192,112,.5);font-weight:900;line-height:1}
.countdown-label{font-size:10px;color:rgba(240,200,140,.6);text-align:center;font-weight:700;line-height:1.3}
.change-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:linear-gradient(135deg,#25d366,#1ebe5d);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:Rubik,sans-serif;box-shadow:0 8px 22px rgba(37,211,102,.35);transition:transform .15s,box-shadow .15s}
.change-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(37,211,102,.45)}
.change-btn:active{transform:translateY(0)}
.change-btn-icon{font-size:20px}

/* REFRESH */
.refresh-note{text-align:center;font-size:11px;color:#b09080;font-weight:700;padding:6px 0 2px;display:flex;align-items:center;justify-content:center;gap:5px}
.refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* LINK BOX */
.link-box{background:linear-gradient(135deg,#1a0a04,#2e1408);border-radius:16px;padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.link-box-icon{font-size:24px;flex-shrink:0}
.link-box-text{flex:1;min-width:0}
.link-box-label{font-size:11px;color:rgba(240,200,150,.65);font-weight:700;margin-bottom:4px}
.link-box-url{font-size:12px;color:rgba(240,200,150,.9);font-weight:700;word-break:break-all;line-height:1.4}
.link-copy-btn{background:rgba(200,112,74,.25);border:1px solid rgba(200,112,74,.4);color:rgba(240,190,130,.9);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:Rubik,sans-serif;white-space:nowrap;transition:all .2s;flex-shrink:0}
.link-copy-btn:hover{background:rgba(200,112,74,.4)}
.link-copy-btn.copied{background:rgba(39,174,96,.25);border-color:rgba(39,174,96,.4);color:rgba(120,220,140,.9)}

/* LOADING / ERROR */
.center-msg{text-align:center;padding:60px 20px}
.center-msg .icon{font-size:60px;margin-bottom:16px;display:block}
.center-msg .title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--brown);margin-bottom:8px}
.center-msg .sub{font-size:14px;color:var(--brown-mid);font-weight:600}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#2d1a0e;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:999;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:linear-gradient(135deg,#1a7a3c,#27ae60)}

@media(max-width:420px){
  .tl-label{font-size:9px}
  .tl-dot{width:30px;height:30px;font-size:13px}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-back" href="index.html">→ חנות</a>
  <div class="nav-logo">🍰 שרה בייקרי</div>
  <div style="width:70px"></div>
</nav>

<div id="heroSection" class="hero" style="display:none">
  <span id="heroEmoji" class="hero-emoji">🎉</span>
  <div id="heroTitle" class="hero-title">ההזמנה שלך בדרך!</div>
  <div id="heroNum" class="hero-num"></div>
  <div id="heroStatusBadge" class="hero-status-badge"></div>
</div>

<div id="mainContent" class="wrap">
  <div class="center-msg" id="loadingMsg">
    <span class="icon">⏳</span>
    <div class="title">טוען הזמנה...</div>
    <div class="sub">רגע אחד</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyDUiu7JxAzdjmZS3Dp1A_TESM6fvxdPPaw",
  authDomain: "sarabakery.firebaseapp.com",
  projectId: "sarabakery",
  storageBucket: "sarabakery.firebasestorage.app",
  messagingSenderId: "595236323371",
  appId: "1:595236323371:web:e2004d0f0d9cdbab23ea6e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
try { await signInAnonymously(auth); } catch(e) {}

const params = new URLSearchParams(location.search);
const orderId = (params.get('id') || '').trim().toUpperCase();

let _waNum = '972523394838';
let _refreshTimer = null;
let _countdownTimer = null;
let _order = null;

const STATUS_MAP = {
  'new':       { label:'התקבלה', emoji:'✅', step:0, cls:'sb-new',       msg:'ההזמנה התקבלה בהצלחה!', sub:'שרה תבדוק ותאשר בקרוב' },
  'seen':      { label:'נראתה',  emoji:'👀', step:1, cls:'sb-seen',      msg:'שרה ראתה את ההזמנה',   sub:'עכשיו היא מתכננת את ההכנה' },
  'preparing': { label:'בהכנה', emoji:'👩‍🍳', step:2, cls:'sb-preparing', msg:'שרה בהכנה עבורך!',     sub:'ריחות טובים בדרך אליך 🤍' },
  'ready':     { label:'מוכנה', emoji:'🎉', step:3, cls:'sb-ready',      msg:'ההזמנה מוכנה!',         sub:'ניתן לאסוף / בדרך אליך' },
  'delivered': { label:'נמסרה', emoji:'🏠', step:4, cls:'sb-delivered',  msg:'ההזמנה נמסרה!',         sub:'תהנו! ❤️' },
  'done':      { label:'הושלמה',emoji:'⭐', step:4, cls:'sb-done',       msg:'ההזמנה הושלמה',         sub:'תודה שהזמנתם מאצל שרה!' },
  'cancelled': { label:'בוטלה', emoji:'❌', step:-1,cls:'sb-cancelled',  msg:'ההזמנה בוטלה',          sub:'לשאלות פנו לשרה בוואטסאפ' },
};
const TIMELINE_STEPS = [
  { key:'new',       label:'התקבלה', emoji:'✅' },
  { key:'seen',      label:'נראתה',  emoji:'👀' },
  { key:'preparing', label:'בהכנה', emoji:'👩‍🍳' },
  { key:'ready',     label:'מוכנה', emoji:'🎉' },
  { key:'delivered', label:'נמסרה', emoji:'🏠' },
];

function shekel(n){ return '₪' + Math.round(Number(n)||0); }
function toast(msg, type=''){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

function normalizeOrder(data){
  const c = data.checkout || {};
  const cu = data.customer || {};
  const t = data.totals || {};
  return {
    orderNum:     data.orderNum || '',
    name:         data.name || cu.name || '',
    phone:        data.phone || cu.phone || '',
    status:       data.status || 'new',
    items:        data.items || [],
    deliveryMode: data.delivery || c.deliveryMode || 'pickup',
    city:         data.city || c.deliveryCity || c.deliveryCityLabel || '',
    address:      data.address || c.address || '',
    date:         data.date || c.readyBy || '',
    time:         data.time || '',
    note:         data.note || c.note || '',
    payment:      data.payment || c.payment || '',
    deliveryFee:  Number(data.deliveryFee || c.deliveryFee || t.shippingFee || 0),
    subtotal:     Number(data.subtotal || t.subtotal || 0),
    saleDiscount: Number(data.saleDiscount || t.discount || 0),
    couponDiscount: Number(data.couponDiscount || 0),
    couponCode:   data.couponCode || (data.coupon && data.coupon.code) || '',
    total:        Number(data.total || t.orderTotal || t.autoOrderTotal || 0),
    createdAt:    data.createdAt,
  };
}

function getCreatedDate(raw){
  if(!raw) return null;
  if(raw.toDate) return raw.toDate();
  if(typeof raw === 'string' || typeof raw === 'number') return new Date(raw);
  if(raw.seconds) return new Date(raw.seconds * 1000);
  return null;
}

function fmtDate(s){
  if(!s) return '';
  const m = String(s).match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3]+'/'+m[2]+'/'+m[1];
  return s;
}

function buildTimeline(status){
  const st = STATUS_MAP[status] || STATUS_MAP['new'];
  const activeStep = st.step;
  return TIMELINE_STEPS.map(function(step, i){
    let cls = '';
    if(status === 'cancelled') cls = 'cancelled';
    else if(i < activeStep) cls = 'done';
    else if(i === activeStep) cls = 'active';
    return '<div class="tl-step '+cls+'">' +
      '<div class="tl-dot">'+step.emoji+'</div>' +
      '<div class="tl-label">'+step.label+'</div>' +
    '</div>';
  }).join('');
}

function buildItems(order){
  if(!order.items || !order.items.length) return '<div style="color:var(--brown-mid);font-size:13px;padding:8px 0">אין פריטים</div>';
  const rows = order.items.map(function(item){
    return '<div class="order-item">' +
      '<div><div class="order-item-name">'+escHtml(item.name||'')+'</div>'+
      (item.details ? '<div class="order-item-details">'+escHtml(item.details)+'</div>' : '') +
      '</div>' +
      '<div class="order-item-price">'+(item.price > 0 ? shekel(item.price) : 'לפי הסכם')+'</div>' +
    '</div>';
  }).join('');

  let totals = '<div class="totals-row"><span>סכום ביניים</span><span class="totals-val">'+shekel(order.subtotal)+'</span></div>';
  if(order.deliveryFee > 0) totals += '<div class="totals-row"><span>דמי משלוח</span><span class="totals-val">'+shekel(order.deliveryFee)+'</span></div>';
  if(order.saleDiscount > 0) totals += '<div class="totals-row" style="color:#1a7a3c"><span>🎉 הנחה</span><span class="totals-val" style="color:#1a7a3c">-'+shekel(order.saleDiscount)+'</span></div>';
  if(order.couponDiscount > 0) totals += '<div class="totals-row" style="color:#1a7a3c"><span>🏷️ קופון'+(order.couponCode?' ('+order.couponCode+')':'')+'</span><span class="totals-val" style="color:#1a7a3c">-'+shekel(order.couponDiscount)+'</span></div>';
  if(order.total > 0) totals += '<div class="totals-row final"><span>סה"כ לתשלום</span><span class="totals-val">'+shekel(order.total)+'</span></div>';

  return rows + totals;
}

function buildDetails(order){
  const rows = [];
  rows.push('<div class="detail-row"><div class="detail-icon">👤</div><div><div class="detail-label">שם</div><div class="detail-val">'+escHtml(order.name)+'</div></div></div>');
  if(order.phone) rows.push('<div class="detail-row"><div class="detail-icon">📱</div><div><div class="detail-label">טלפון</div><div class="detail-val">'+escHtml(order.phone)+'</div></div></div>');

  const modeText = order.deliveryMode === 'delivery' ? 'משלוח' : 'איסוף עצמי';
  const modeEmoji = order.deliveryMode === 'delivery' ? '🚚' : '🏠';
  let modeVal = modeText;
  if(order.deliveryMode === 'delivery' && order.city) modeVal += ' ל' + order.city;
  if(order.address) modeVal += ' — ' + order.address;
  rows.push('<div class="detail-row"><div class="detail-icon">'+modeEmoji+'</div><div><div class="detail-label">אופן קבלה</div><div class="detail-val">'+escHtml(modeVal)+'</div></div></div>');

  const dateStr = fmtDate(order.date) + (order.time ? ' בשעה '+order.time : '');
  if(dateStr.trim()) rows.push('<div class="detail-row"><div class="detail-icon">📅</div><div><div class="detail-label">מועד קבלה</div><div class="detail-val">'+escHtml(dateStr.trim())+'</div></div></div>');

  if(order.payment) rows.push('<div class="detail-row"><div class="detail-icon">💳</div><div><div class="detail-label">תשלום</div><div class="detail-val">'+escHtml(order.payment)+'</div></div></div>');
  if(order.note) rows.push('<div class="detail-row"><div class="detail-icon">📝</div><div><div class="detail-label">הערות</div><div class="detail-val">'+escHtml(order.note)+'</div></div></div>');

  return rows.join('');
}

function buildChangeBox(order, createdDate){
  if(!createdDate) return '';
  const elapsed = Date.now() - createdDate.getTime();
  const WINDOW = 30 * 60 * 1000;
  const remaining = WINDOW - elapsed;

  if(remaining <= 0){
    return '<div class="change-box change-expired">' +
      '<div class="change-head">' +
        '<div class="change-icon">⏰</div>' +
        '<div><div class="change-title expired">חלון השינוי נסגר</div>' +
        '<div class="change-sub expired">ניתן היה לבקש שינוי עד 30 דקות מרגע ההזמנה</div></div>' +
      '</div>' +
      '<div style="padding:0 18px 14px;font-size:12px;color:var(--brown-mid);font-weight:700">לשינויים לאחר מכן — צרי קשר עם שרה ישירות: <a href="https://wa.me/'+_waNum+'" style="color:var(--copper);font-weight:900">וואטסאפ →</a></div>' +
    '</div>';
  }

  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  const waMsg = encodeURIComponent('שלום שרה! אני רוצה לבקש שינוי בהזמנה מס\' ' + order.orderNum + '.\nשם: ' + order.name + '\nהשינוי המבוקש: ');

  return '<div class="change-box change-active">' +
    '<div class="change-head">' +
      '<div class="change-icon">✏️</div>' +
      '<div><div class="change-title">בקשת שינוי בהזמנה</div>' +
      '<div class="change-sub">חלון השינוי פתוח עוד:</div></div>' +
    '</div>' +
    '<div class="change-body">' +
      '<div class="change-countdown">' +
        '<div><div class="countdown-num" id="cdMins">'+pad(mins)+'</div><div class="countdown-label">דקות</div></div>' +
        '<div class="countdown-sep">:</div>' +
        '<div><div class="countdown-num" id="cdSecs">'+pad(secs)+'</div><div class="countdown-label">שניות</div></div>' +
      '</div>' +
      '<a href="https://wa.me/'+_waNum+'?text='+waMsg+'" class="change-btn" target="_blank">' +
        '<span class="change-btn-icon">💬</span>' +
        'שלחי שינוי לשרה בוואטסאפ' +
      '</a>' +
    '</div>' +
  '</div>';
}

function pad(n){ return String(n).padStart(2,'0'); }

function buildTrackingLink(){
  const url = location.origin + location.pathname + '?id=' + orderId;
  return '<div class="link-box">' +
    '<div class="link-box-icon">🔗</div>' +
    '<div class="link-box-text">' +
      '<div class="link-box-label">שמרי את הקישור למעקב</div>' +
      '<div class="link-box-url">'+escHtml(url)+'</div>' +
    '</div>' +
    '<button class="link-copy-btn" onclick="copyTrackingLink(\''+escHtml(url)+'\')">העתק</button>' +
  '</div>';
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.copyTrackingLink = function(url){
  navigator.clipboard.writeText(url).then(function(){
    document.querySelectorAll('.link-copy-btn').forEach(function(b){ b.textContent='✅ הועתק'; b.classList.add('copied'); });
    toast('הקישור הועתק!','ok');
    setTimeout(function(){ document.querySelectorAll('.link-copy-btn').forEach(function(b){ b.textContent='העתק'; b.classList.remove('copied'); }); }, 2500);
  }).catch(function(){ toast('לא ניתן להעתיק — העתיקי ידנית'); });
};

function startCountdown(createdDate){
  clearInterval(_countdownTimer);
  function tick(){
    const elapsed = Date.now() - createdDate.getTime();
    const remaining = Math.max(0, 30*60*1000 - elapsed);
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    const m = document.getElementById('cdMins');
    const s = document.getElementById('cdSecs');
    if(!m || !s){ clearInterval(_countdownTimer); return; }
    m.textContent = pad(mins);
    s.textContent = pad(secs);
    if(remaining <= 0){
      clearInterval(_countdownTimer);
      // Reload page to show expired state
      renderPage(_order);
    }
  }
  _countdownTimer = setInterval(tick, 1000);
}

function renderPage(order){
  _order = order;
  const st = STATUS_MAP[order.status] || STATUS_MAP['new'];
  const createdDate = getCreatedDate(order.createdAt);

  // Hero
  const hero = document.getElementById('heroSection');
  hero.style.display = '';
  document.getElementById('heroEmoji').textContent = st.emoji;
  document.getElementById('heroTitle').textContent = st.msg;
  document.getElementById('heroNum').textContent = 'הזמנה מס\' ' + order.orderNum;
  const badge = document.getElementById('heroStatusBadge');
  badge.textContent = st.label;
  badge.style.background = 'rgba(255,255,255,.12)';
  badge.style.border = '1px solid rgba(255,255,255,.22)';
  badge.style.color = '#fff';

  const content = document.getElementById('mainContent');
  content.innerHTML =
    // Status banner
    '<div class="status-banner '+st.cls+'">' +
      '<div class="sb-icon">'+st.emoji+'</div>' +
      '<div><div class="sb-title">'+st.msg+'</div><div class="sb-sub">'+st.sub+'</div></div>' +
    '</div>' +

    // Timeline
    '<div class="card">' +
      '<div class="card-title"><span class="card-title-icon">📍</span> מצב ההזמנה</div>' +
      '<div class="timeline">' + buildTimeline(order.status) + '</div>' +
    '</div>' +

    // Tracking link
    buildTrackingLink() +

    // Change request
    buildChangeBox(order, createdDate) +

    // Items
    '<div class="card">' +
      '<div class="card-title"><span class="card-title-icon">🧁</span> הפריטים שהזמנת</div>' +
      buildItems(order) +
    '</div>' +

    // Details
    '<div class="card">' +
      '<div class="card-title"><span class="card-title-icon">📋</span> פרטי ההזמנה</div>' +
      buildDetails(order) +
    '</div>' +

    // Refresh note
    '<div class="refresh-note"><span class="refresh-dot"></span>מתרענן אוטומטית כל דקה</div>';

  // Start countdown if within window
  if(createdDate){
    const elapsed = Date.now() - createdDate.getTime();
    if(elapsed < 30*60*1000) startCountdown(createdDate);
  }
}

async function loadOrder(){
  if(!orderId){
    document.getElementById('mainContent').innerHTML =
      '<div class="center-msg"><span class="icon">❓</span><div class="title">לא נמצא מספר הזמנה</div>' +
      '<div class="sub">בדקי את הקישור שקיבלת</div></div>';
    return;
  }

  // Load settings for WA number
  try {
    const snap = await getDoc(doc(db, 'settings', 'main'));
    if(snap.exists() && snap.data().whatsapp) _waNum = snap.data().whatsapp.replace(/\D/g,'');
  } catch(e){}

  try {
    const snap = await getDoc(doc(db, 'orders', orderId));
    if(!snap.exists()){
      document.getElementById('mainContent').innerHTML =
        '<div class="center-msg"><span class="icon">🔍</span><div class="title">ההזמנה לא נמצאה</div>' +
        '<div class="sub">בדקי את מספר ההזמנה או <a href="index.html" style="color:var(--copper)">חזרי לחנות</a></div></div>';
      return;
    }
    const order = normalizeOrder({ id: snap.id, ...snap.data() });
    renderPage(order);
  } catch(e){
    document.getElementById('mainContent').innerHTML =
      '<div class="center-msg"><span class="icon">⚠️</span><div class="title">שגיאה בטעינה</div>' +
      '<div class="sub">נסי לרענן את הדף</div></div>';
  }
}

// Auto-refresh every 60 seconds
function scheduleRefresh(){
  clearTimeout(_refreshTimer);
  _refreshTimer = setTimeout(async function(){
    try {
      const snap = await getDoc(doc(db, 'orders', orderId));
      if(snap.exists()){
        const fresh = normalizeOrder({ id: snap.id, ...snap.data() });
        // Only re-render if status changed
        if(!_order || fresh.status !== _order.status) renderPage(fresh);
      }
    } catch(e){}
    scheduleRefresh();
  }, 60000);
}

loadOrder().then(scheduleRefresh);
</script>
</body>
</html>
